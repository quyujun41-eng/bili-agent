<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>B站数据 AI 分析</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
  --primary: #6366f1; --pri-dark: #4f46e5;
  --pri-light: #e0e7ff; --bg: #f0f2f8;
  --border: #e5e7eb; --text: #111827; --muted: #6b7280;
  --sb-w: 230px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  display: flex; height: 100vh; overflow: hidden;
}

/* ── 侧边栏 ─────────────────────────────────────────── */
.side-nav {
  width: var(--sb-w); background: #111827;
  display: flex; flex-direction: column;
  flex-shrink: 0; position: fixed;
  left: 0; top: 0; bottom: 0; z-index: 100;
}
.side-logo {
  padding: 18px 16px 14px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.side-logo .logo-ico {
  width: 38px; height: 38px;
  background: linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius: 10px; margin-bottom: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 18px;
}
.side-logo strong { display: block; color: #fff; font-size: 14px; font-weight: 700; }
.side-logo span   { font-size: 12px; color: rgba(255,255,255,.35); margin-top: 4px; display: block; }

.side-menu { padding: 10px 8px; flex: 1; overflow-y: auto; }
.side-menu a {
  display: flex; align-items: center; gap: 9px;
  padding: 10px 12px; margin-bottom: 2px;
  border-radius: 9px; font-size: 14px;
  color: rgba(255,255,255,.65); text-decoration: none;
  transition: all .15s; font-weight: 500;
}
.side-menu a:hover  { background: rgba(255,255,255,.08); color: #fff; }
.side-menu a.active { background: rgba(99,102,241,.2); color: #a5b4fc; }
.side-menu a i      { width: 20px; text-align: center; font-size: 15px; }

.side-divider {
  height: 1px; background: rgba(255,255,255,.06); margin: 12px 0;
}
.side-section-label {
  font-size: 11px; font-weight: 600; color: rgba(255,255,255,.3);
  text-transform: uppercase; letter-spacing: .06em;
  padding: 0 8px; margin-bottom: 10px;
}
.side-desc {
  padding: 0 10px; font-size: 13px;
  color: rgba(255,255,255,.4); line-height: 1.8;
}

.side-bottom {
  padding: 14px 16px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.status-row {
  display: flex; align-items: center; gap: 7px;
  font-size: 13px; color: rgba(255,255,255,.45); margin-bottom: 6px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: #34d399; box-shadow: 0 0 5px #34d39960; }

/* ── 主区域 ──────────────────────────────────────────── */
.content-wrap {
  margin-left: var(--sb-w); flex: 1;
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}

.top-hd {
  background: #fff; border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
  height: 52px; display: flex; align-items: center;
  padding: 0 20px; flex-shrink: 0;
}
.hd-title { font-size: 15px; font-weight: 700; color: var(--text); }
.hd-sub   { font-size: 12px; color: var(--muted); margin-left: 10px; }
.hd-badge {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; background: #f0fdf4;
  border: 1px solid #bbf7d0; border-radius: 20px;
  font-size: 12px; color: #15803d; font-weight: 500;
}
.hd-badge i { font-size: 8px; }

.page-wrap {
  flex: 1; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 18px 24px; gap: 14px;
}

/* ── 快捷按钮 ─────────────────────────────────────────── */
.suggestions { display: flex; flex-wrap: wrap; gap: 8px; flex-shrink: 0; }
.suggestions button {
  padding: 6px 14px; border: 1.5px solid var(--primary);
  color: var(--primary); background: #fff;
  border-radius: 16px; font-size: 13px;
  cursor: pointer; transition: all .15s;
}
.suggestions button:hover { background: var(--primary); color: #fff; }

/* ── 聊天框 ──────────────────────────────────────────── */
.chat-box {
  flex: 1; background: #fff;
  border-radius: 12px; border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
  overflow-y: auto; padding: 20px; min-height: 0;
}
.chat-box::-webkit-scrollbar { width: 4px; }
.chat-box::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }

.msg { margin-bottom: 18px; }
.msg.user { text-align: right; }
.msg .label { font-size: 12px; color: #aaa; margin-bottom: 4px; }
.msg.user .bubble {
  background: var(--primary); color: #fff;
  display: inline-block; padding: 10px 16px;
  border-radius: 18px 18px 4px 18px; max-width: 80%; text-align: left;
}
.msg.bot .bubble {
  background: #f5f3ff; color: #333;
  display: inline-block; padding: 12px 16px;
  border-radius: 18px 18px 18px 4px; max-width: 92%; text-align: left;
}

.agent-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 10px; border-radius: 10px;
  font-size: 11px; font-weight: 600; margin-bottom: 6px;
}
.agent-sql  { background: #ede9fe; color: #7c3aed; }
.agent-rag  { background: #fef3c7; color: #d97706; }
.agent-chat { background: #dcfce7; color: #16a34a; }

.sql-block {
  background: #1e1e2e; color: #a6e3a1; font-family: monospace;
  font-size: 12px; padding: 10px 14px; border-radius: 6px;
  margin-top: 10px; white-space: pre-wrap; word-break: break-all;
}
.chart-area { margin-top: 14px; width: 100%; height: 280px; }
.table-wrap { margin-top: 10px; overflow-x: auto; }
table { border-collapse: collapse; font-size: 12px; width: 100%; }
th {
  background: var(--primary); color: #fff;
  padding: 7px 12px; text-align: left; white-space: nowrap;
}
td { padding: 6px 12px; border-bottom: 1px solid #f0f0f0; }
tr:nth-child(even) td { background: #f5f3ff; }
.total-hint { font-size: 12px; color: #aaa; margin-top: 6px; }
.btn-csv {
  margin-top: 8px; padding: 4px 14px; font-size: 12px;
  border: 1px solid var(--primary); color: var(--primary);
  background: #fff; border-radius: 12px; cursor: pointer; transition: all .15s;
}
.btn-csv:hover { background: var(--primary); color: #fff; }

.thinking { color: #aaa; font-size: 13px; }
.thinking::after { content: ''; animation: dots 1.2s infinite; }
@keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

/* ── 输入框 ──────────────────────────────────────────── */
.input-row { display: flex; gap: 10px; flex-shrink: 0; }
.input-row input {
  flex: 1; padding: 12px 18px;
  border: 1.5px solid var(--border); border-radius: 26px;
  font-size: 15px; outline: none; transition: border .2s; min-width: 0;
}
.input-row input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99,102,241,.1);
}
.input-row button {
  padding: 12px 26px; background: var(--primary); color: #fff;
  border: none; border-radius: 26px; font-size: 15px;
  cursor: pointer; font-weight: 600; transition: background .2s;
  white-space: nowrap; flex-shrink: 0;
}
.input-row button:disabled { background: #c4b5fd; cursor: default; }
.input-row button:hover:not(:disabled) { background: var(--pri-dark); }

/* 移动端 */
@media (max-width: 768px) {
  .side-nav { display: none; }
  .content-wrap { margin-left: 0; }
  .page-wrap { padding: 12px; }
  .hd-sub { display: none; }
}
</style>
</head>
<body>

<!-- ── 侧边栏 ────────────────────────────────────────── -->
<div class="side-nav">
  <div class="side-logo">
    <div class="logo-ico">🎬</div>
    <strong>B站数据 AI 分析</strong>
    <span>查询 · 推荐 · 可视化</span>
  </div>

  <nav class="side-menu">
    <a href="#" class="active">
      <i class="fa fa-comments"></i>AI 问答
    </a>
    <div class="side-divider"></div>
    <div class="side-section-label">功能说明</div>
    <div class="side-desc">
      支持自然语言查询<br>
      数据统计 · SQL 生成<br>
      视频推荐 · 图表展示
    </div>
    <div class="side-divider" style="margin-top:14px;"></div>
    <div class="side-section-label">Agent 类型</div>
    <div style="padding:0 8px;">
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px;">
        <span style="background:#ede9fe;color:#7c3aed;font-size:12px;padding:3px 10px;border-radius:8px;font-weight:600;">SQL</span>
        <span style="font-size:13px;color:rgba(255,255,255,.4);">数据统计查询</span>
      </div>
      <div style="display:flex;align-items:center;gap:9px;margin-bottom:8px;">
        <span style="background:#fef3c7;color:#d97706;font-size:12px;padding:3px 10px;border-radius:8px;font-weight:600;">RAG</span>
        <span style="font-size:13px;color:rgba(255,255,255,.4);">视频语义推荐</span>
      </div>
      <div style="display:flex;align-items:center;gap:9px;">
        <span style="background:#dcfce7;color:#16a34a;font-size:12px;padding:3px 10px;border-radius:8px;font-weight:600;">Chat</span>
        <span style="font-size:13px;color:rgba(255,255,255,.4);">通用对话</span>
      </div>
    </div>
  </nav>

  <div class="side-bottom">
    <div class="side-section-label">系统状态</div>
    <div class="status-row"><span class="dot green"></span>服务运行中</div>
    <div class="status-row"><span class="dot green"></span>向量库就绪</div>
    <div class="status-row"><span class="dot green"></span>缓存在线</div>
  </div>
</div>

<!-- ── 主区域 ─────────────────────────────────────────── -->
<div class="content-wrap">
  <header class="top-hd">
    <span class="hd-title">B站数据 AI 分析助手</span>
    <span class="hd-sub">Qdrant + BM25 混合检索 · SQL 自动生成 · 流式输出</span>
    <span class="hd-badge"><i class="fa fa-circle"></i>在线</span>
  </header>

  <div class="page-wrap">
    <!-- 快捷提问 -->
    <div class="suggestions">
      <button onclick="ask('播放量最高的10个视频是哪些？')">
        <i class="fa fa-fire"></i> 播放量 Top10
      </button>
      <button onclick="ask('各分区平均播放量是多少？')">
        <i class="fa fa-bar-chart"></i> 各分区对比
      </button>
      <button onclick="ask('2026年和2025年各分区视频数量对比')">
        <i class="fa fa-calendar"></i> 年份对比
      </button>
      <button onclick="ask('发布视频最多的UP主前5名')">
        <i class="fa fa-user"></i> UP主排行
      </button>
      <button onclick="ask('推荐一些搞笑有趣的视频')">
        <i class="fa fa-star"></i> 视频推荐
      </button>
    </div>

    <!-- 聊天区 -->
    <div class="chat-box" id="chatBox">
      <div class="msg bot">
        <div class="label">AI 助手</div>
        <div class="bubble">
          <div style="font-size:15px;font-weight:600;margin-bottom:14px;color:#1e1b4b;">
            你好！我是B站数据AI分析助手 👋
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;margin-bottom:16px;">
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff;border-radius:9px;border:1px solid #e0e7ff;">
              <span style="font-size:18px;flex-shrink:0;">📊</span>
              <div>
                <div style="font-weight:600;font-size:13px;color:#1e1b4b;margin-bottom:2px;">查数据</div>
                <div style="font-size:12px;color:#6b7280;">播放量、点赞、UP主排行、分区对比等统计分析</div>
              </div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff;border-radius:9px;border:1px solid #e0e7ff;">
              <span style="font-size:18px;flex-shrink:0;">🔍</span>
              <div>
                <div style="font-weight:600;font-size:13px;color:#1e1b4b;margin-bottom:2px;">找视频</div>
                <div style="font-size:12px;color:#6b7280;">根据关键词语义搜索推荐相关视频</div>
              </div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:#fff;border-radius:9px;border:1px solid #e0e7ff;">
              <span style="font-size:18px;flex-shrink:0;">💬</span>
              <div>
                <div style="font-weight:600;font-size:13px;color:#1e1b4b;margin-bottom:2px;">聊天</div>
                <div style="font-size:12px;color:#6b7280;">任何问题都可以问我</div>
              </div>
            </div>
          </div>
          <div style="font-size:13px;color:#9ca3af;">试试上方快捷按钮，或直接输入问题。</div>
        </div>
      </div>
    </div>

    <!-- 输入框 -->
    <div class="input-row">
      <input id="inputQ" type="text"
        placeholder="输入问题，如：哪个UP主粉丝数最多？"
        onkeydown="if(event.key==='Enter')sendQ()"/>
      <button id="sendBtn" onclick="sendQ()">
        <i class="fa fa-paper-plane"></i> 发送
      </button>
    </div>
  </div>
</div>

<script>
var chartInstances = {};
var chatHistory   = [];
var ACCESS_TOKEN  = '{{ access_token }}';

function ask(q) {
  document.getElementById('inputQ').value = q;
  sendQ();
}

function sendQ() {
  var input = document.getElementById('inputQ');
  var q = input.value.trim();
  if (!q) return;
  input.value = '';

  var btn = document.getElementById('sendBtn');
  btn.disabled = true;

  appendMsg('user', '<div class="bubble">' + escHtml(q) + '</div>');

  var thinkId      = 'think_' + Date.now();
  var bubbleId     = 'bubble_' + Date.now();
  var bubbleCreated = false;
  var agentType    = '';
  var answerText   = '';

  appendMsg('bot', '<div class="bubble thinking" id="' + thinkId + '">AI 正在思考</div>');

  function agentIcon(t)  { return t==='sql'?'fa-database':t==='rag'?'fa-search':'fa-comments'; }
  function agentLabel(t) { return t==='sql'?'数据查询':t==='rag'?'视频推荐':'智能问答'; }

  function ensureBubble() {
    if (bubbleCreated) return;
    var el = document.getElementById(thinkId);
    if (el) el.parentElement.remove();
    var badge = agentType
      ? '<span class="agent-badge agent-' + agentType + '"><i class="fa ' + agentIcon(agentType) + '"></i> ' + agentLabel(agentType) + '</span>'
      : '';
    appendMsg('bot', badge + '<div class="bubble" id="' + bubbleId + '"><div class="answer-text"></div></div>');
    bubbleCreated = true;
  }

  fetch('/api/ask', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + ACCESS_TOKEN
    },
    body: JSON.stringify({ question: q, history: chatHistory })
  }).then(function(resp) {
    var reader  = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf     = '';

    function read() {
      reader.read().then(function(result) {
        if (result.done) { btn.disabled = false; return; }
        buf += decoder.decode(result.value, { stream: true });
        var parts = buf.split('\n\n');
        buf = parts.pop();
        parts.forEach(function(part) {
          if (!part.startsWith('data: ')) return;
          try {
            var chunk = JSON.parse(part.slice(6));
            if (chunk.type === 'agent') {
              agentType = chunk.agent;
            } else if (chunk.type === 'text') {
              ensureBubble();
              answerText += chunk.text;
              var b = document.getElementById(bubbleId);
              if (b) {
                b.querySelector('.answer-text').innerHTML =
                  '<div style="font-size:14px;line-height:1.8;">' + escHtml(answerText) + '</div>';
                document.getElementById('chatBox').scrollTop = 9999;
              }
            } else if (chunk.type === 'done') {
              ensureBubble();
              renderFinal(bubbleId, answerText, chunk);
              chatHistory.push({ role: 'user',      content: q });
              chatHistory.push({ role: 'assistant', content: answerText });
              btn.disabled = false;
            } else if (chunk.type === 'error') {
              var el = document.getElementById(thinkId);
              if (el) el.parentElement.remove();
              appendMsg('bot', '<div class="bubble" style="color:#ef4444;"><i class="fa fa-exclamation-circle"></i> ' + escHtml(chunk.error) + '</div>');
              btn.disabled = false;
            }
          } catch(e) {}
        });
        read();
      });
    }
    read();
  }).catch(function() {
    var el = document.getElementById(thinkId);
    if (el) el.parentElement.remove();
    appendMsg('bot', '<div class="bubble" style="color:#ef4444;"><i class="fa fa-exclamation-circle"></i> 请求失败，请重试</div>');
    btn.disabled = false;
  });
}

function renderFinal(bubbleId, answerText, data) {
  var chartId = 'chart_' + Date.now();
  var b = document.getElementById(bubbleId);
  if (!b) return;

  var html = '<div style="font-size:14px;line-height:1.8;">' + escHtml(answerText) + '</div>';

  if (data.sql)
    html += '<div class="sql-block">' + escHtml(data.sql) + '</div>';

  if (data.chart && data.chart.should_chart)
    html += '<div class="chart-area" id="' + chartId + '"></div>';

  if (data.rows && data.rows.length > 0) {
    html += '<div class="table-wrap"><table><thead><tr>';
    data.columns.forEach(function(c) {
      html += '<th>' + escHtml(String(c)) + '</th>';
    });
    html += '</tr></thead><tbody>';
    data.rows.forEach(function(row) {
      html += '<tr>';
      row.forEach(function(cell) {
        html += '<td>' + escHtml(cell === null ? '-' : String(cell)) + '</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    if (data.total > data.rows.length)
      html += '<div class="total-hint"><i class="fa fa-info-circle"></i> 共 ' + data.total + ' 条，显示前 ' + data.rows.length + ' 条</div>';
    html += '<button class="btn-csv" onclick="downloadCSV(this)"><i class="fa fa-download"></i> 下载 CSV</button>';
  }

  b.innerHTML = html;
  document.getElementById('chatBox').scrollTop = 9999;

  if (data.chart && data.chart.should_chart && data.chart.option) {
    setTimeout(function() {
      var el = document.getElementById(chartId);
      if (el) {
        var c = echarts.init(el);
        c.setOption(data.chart.option);
        chartInstances[chartId] = c;
      }
    }, 50);
  }
}

function downloadCSV(btn) {
  var table = btn.closest('.bubble').querySelector('table');
  if (!table) return;
  var csv = Array.from(table.querySelectorAll('tr')).map(function(row) {
    return Array.from(row.querySelectorAll('th,td')).map(function(cell) {
      return '"' + cell.textContent.replace(/"/g, '""') + '"';
    }).join(',');
  }).join('\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'bili_data.csv'; a.click();
  URL.revokeObjectURL(url);
}

function appendMsg(role, content) {
  var box = document.getElementById('chatBox');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="label">' + (role === 'user' ? '你' : 'AI 助手') + '</div>' + content;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

window.addEventListener('resize', function() {
  Object.values(chartInstances).forEach(function(c) { try { c.resize(); } catch(e) {} });
});
</script>
</body>
</html>
