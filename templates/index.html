<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>B站数据 AI 分析</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"/>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<style>
:root {
  --primary: #6366f1; --pri-dark: #4f46e5;
  --pri-light: #e0e7ff; --bg: #f0f2f8;
  --border: #e5e7eb; --text: #111827; --muted: #6b7280;
  --sb-w: 240px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  font-family: -apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
  display: flex; height: 100vh; overflow: hidden;
}

/* ── 侧边栏 ─────────────────────────────── */
.side-nav {
  width: var(--sb-w); background: #111827;
  display: flex; flex-direction: column;
  flex-shrink: 0; position: fixed;
  left: 0; top: 0; bottom: 0; z-index: 100;
}
.side-logo {
  padding: 16px 14px 12px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.side-logo .logo-ico {
  width: 36px; height: 36px;
  background: linear-gradient(135deg,#6366f1,#8b5cf6);
  border-radius: 10px; margin-bottom: 8px;
  display: flex; align-items: center; justify-content: center; font-size: 16px;
}
.side-logo strong { display: block; color: #fff; font-size: 13px; font-weight: 700; }
.side-logo span   { font-size: 11px; color: rgba(255,255,255,.3); margin-top: 2px; display: block; }

/* 新建会话按钮 */
.new-session-btn {
  margin: 10px 10px 6px;
  padding: 8px 12px;
  background: rgba(99,102,241,.15);
  border: 1px solid rgba(99,102,241,.3);
  border-radius: 8px; color: #a5b4fc;
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  transition: all .15s; width: calc(100% - 20px);
}
.new-session-btn:hover { background: rgba(99,102,241,.25); color: #c4b5fd; }

/* 会话历史 */
.session-section {
  padding: 6px 8px 4px;
  border-bottom: 1px solid rgba(255,255,255,.05);
}
.section-label {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,.25);
  text-transform: uppercase; letter-spacing: .06em;
  padding: 0 6px; margin-bottom: 6px;
}
.session-list {
  max-height: 200px; overflow-y: auto;
}
.session-list::-webkit-scrollbar { width: 3px; }
.session-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,.1); border-radius: 3px; }
.session-item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 8px; border-radius: 7px;
  cursor: pointer; transition: background .15s;
  margin-bottom: 2px;
}
.session-item:hover { background: rgba(255,255,255,.07); }
.session-item.active { background: rgba(99,102,241,.2); }
.session-item .preview {
  flex: 1; font-size: 12px;
  color: rgba(255,255,255,.5);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.session-item.active .preview { color: #a5b4fc; }
.session-del {
  font-size: 11px; color: rgba(255,255,255,.2);
  padding: 2px 4px; border-radius: 4px;
  opacity: 0; transition: opacity .15s;
  cursor: pointer; flex-shrink: 0;
}
.session-item:hover .session-del { opacity: 1; }
.session-del:hover { color: #f87171; background: rgba(248,113,113,.1); }
.no-sessions { font-size: 12px; color: rgba(255,255,255,.2); padding: 6px 8px; }

/* 导航和信息 */
.side-menu { padding: 8px; flex: 1; overflow-y: auto; min-height: 0; }
.side-menu a {
  display: flex; align-items: center; gap: 9px;
  padding: 9px 10px; margin-bottom: 2px;
  border-radius: 9px; font-size: 14px;
  color: rgba(255,255,255,.65); text-decoration: none;
  transition: all .15s; font-weight: 500;
}
.side-menu a:hover  { background: rgba(255,255,255,.08); color: #fff; }
.side-menu a.active { background: rgba(99,102,241,.2); color: #a5b4fc; }
.side-menu a i      { width: 20px; text-align: center; font-size: 14px; }
.side-divider { height: 1px; background: rgba(255,255,255,.06); margin: 8px 0; }
.side-section-label {
  font-size: 10px; font-weight: 600; color: rgba(255,255,255,.25);
  text-transform: uppercase; letter-spacing: .06em;
  padding: 0 8px; margin-bottom: 8px;
}

/* 统计面板 */
.stats-panel {
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.stat-card {
  background: rgba(255,255,255,.05);
  border-radius: 7px; padding: 7px 8px;
  text-align: center;
}
.stat-val  { font-size: 16px; font-weight: 700; color: #a5b4fc; }
.stat-label { font-size: 10px; color: rgba(255,255,255,.3); margin-top: 2px; }
.agent-pills { display: flex; flex-wrap: wrap; gap: 4px; }
.agent-pill {
  font-size: 11px; padding: 2px 7px; border-radius: 8px;
  font-weight: 600;
}
.agent-pill.sql  { background: #ede9fe; color: #7c3aed; }
.agent-pill.rag  { background: #fef3c7; color: #d97706; }
.agent-pill.chat { background: #dcfce7; color: #16a34a; }

/* 状态 */
.side-bottom {
  padding: 10px 12px;
  border-top: 1px solid rgba(255,255,255,.06);
}
.status-row {
  display: flex; align-items: center; gap: 7px;
  font-size: 12px; color: rgba(255,255,255,.4); margin-bottom: 5px;
}
.dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: #34d399; box-shadow: 0 0 5px #34d39960; }

/* ── 主区域 ─────────────────────────────── */
.content-wrap {
  margin-left: var(--sb-w); flex: 1;
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
}
.top-hd {
  background: #fff; border-bottom: 1px solid var(--border);
  box-shadow: 0 1px 4px rgba(0,0,0,.04);
  height: 52px; display: flex; align-items: center;
  padding: 0 20px; flex-shrink: 0;
}
.hd-title { font-size: 15px; font-weight: 700; color: var(--text); }
.hd-sub   { font-size: 12px; color: var(--muted); margin-left: 10px; }
.hd-badge {
  margin-left: auto;
  display: flex; align-items: center; gap: 6px;
  padding: 4px 12px; background: #f0fdf4;
  border: 1px solid #bbf7d0; border-radius: 20px;
  font-size: 12px; color: #15803d; font-weight: 500;
}
.hd-ver { font-size: 11px; color: var(--muted); margin-left: 10px; }

.page-wrap {
  flex: 1; overflow: hidden;
  display: flex; flex-direction: column;
  padding: 16px 20px; gap: 12px;
}

/* 快捷按钮 */
.suggestions { display: flex; flex-wrap: wrap; gap: 7px; flex-shrink: 0; }
.suggestions button {
  padding: 5px 13px; border: 1.5px solid var(--primary);
  color: var(--primary); background: #fff;
  border-radius: 16px; font-size: 12px;
  cursor: pointer; transition: all .15s;
}
.suggestions button:hover { background: var(--primary); color: #fff; }

/* 聊天框 */
.chat-box {
  flex: 1; background: #fff;
  border-radius: 12px; border: 1px solid var(--border);
  box-shadow: 0 2px 10px rgba(0,0,0,.05);
  overflow-y: auto; padding: 18px; min-height: 0;
}
.chat-box::-webkit-scrollbar { width: 4px; }
.chat-box::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 4px; }
.msg { margin-bottom: 16px; }
.msg.user { text-align: right; }
.msg .label { font-size: 11px; color: #aaa; margin-bottom: 3px; }
.msg.user .bubble {
  background: var(--primary); color: #fff;
  display: inline-block; padding: 9px 15px;
  border-radius: 18px 18px 4px 18px; max-width: 80%; text-align: left;
}
.msg.bot .bubble {
  background: #f5f3ff; color: #333;
  display: inline-block; padding: 11px 15px;
  border-radius: 18px 18px 18px 4px; max-width: 92%; text-align: left;
}
.agent-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 9px; border-radius: 9px;
  font-size: 11px; font-weight: 600; margin-bottom: 5px;
}
.agent-sql  { background: #ede9fe; color: #7c3aed; }
.agent-rag  { background: #fef3c7; color: #d97706; }
.agent-chat { background: #dcfce7; color: #16a34a; }
.sql-block {
  background: #1e1e2e; color: #a6e3a1; font-family: monospace;
  font-size: 12px; padding: 10px 14px; border-radius: 6px;
  margin-top: 10px; white-space: pre-wrap; word-break: break-all;
}
.chart-area { margin-top: 12px; width: 100%; height: 260px; }
.table-wrap { margin-top: 10px; overflow-x: auto; }
table { border-collapse: collapse; font-size: 12px; width: 100%; }
th { background: var(--primary); color: #fff; padding: 6px 11px; text-align: left; white-space: nowrap; }
td { padding: 5px 11px; border-bottom: 1px solid #f0f0f0; }
tr:nth-child(even) td { background: #f5f3ff; }
.total-hint { font-size: 12px; color: #aaa; margin-top: 5px; }
.btn-csv {
  margin-top: 7px; padding: 4px 13px; font-size: 12px;
  border: 1px solid var(--primary); color: var(--primary);
  background: #fff; border-radius: 12px; cursor: pointer; transition: all .15s;
}
.btn-csv:hover { background: var(--primary); color: #fff; }
.insight-box {
  margin-top: 10px; padding: 8px 12px;
  background: #fffbeb; border-left: 3px solid #f59e0b;
  border-radius: 0 8px 8px 0; font-size: 13px; color: #92400e;
}
.rewrite-hint {
  font-size: 11px; color: #a5b4fc; margin-bottom: 6px;
  display: flex; align-items: center; gap: 5px;
}
.feedback-row {
  margin-top: 8px; display: flex; align-items: center; gap: 8px;
}
.fb-btn {
  background: none; border: 1px solid #e5e7eb;
  border-radius: 8px; padding: 3px 10px; cursor: pointer;
  font-size: 14px; transition: all .15s; color: #6b7280;
}
.fb-btn:hover { border-color: var(--primary); background: var(--pri-light); }
.fb-btn:disabled { opacity: .5; cursor: default; }
.fb-label { font-size: 11px; color: #aaa; }
.thinking { color: #aaa; font-size: 13px; }
.thinking::after { content: ''; animation: dots 1.2s infinite; }
@keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

/* 输入框 */
.input-row { display: flex; gap: 10px; flex-shrink: 0; }
.input-row input {
  flex: 1; padding: 11px 17px;
  border: 1.5px solid var(--border); border-radius: 26px;
  font-size: 14px; outline: none; transition: border .2s; min-width: 0;
}
.input-row input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px rgba(99,102,241,.1);
}
.input-row button {
  padding: 11px 24px; background: var(--primary); color: #fff;
  border: none; border-radius: 26px; font-size: 14px;
  cursor: pointer; font-weight: 600; transition: background .2s;
  white-space: nowrap; flex-shrink: 0;
}
.input-row button:disabled { background: #c4b5fd; cursor: default; }
.input-row button:hover:not(:disabled) { background: var(--pri-dark); }

@media (max-width: 768px) {
  .side-nav { display: none; }
  .content-wrap { margin-left: 0; }
  .page-wrap { padding: 10px; }
  .hd-sub, .hd-ver { display: none; }
}
</style>
</head>
<body>

<!-- ── 侧边栏 ─────────────────────────────── -->
<div class="side-nav">
  <div class="side-logo">
    <div class="logo-ico">🎬</div>
    <strong>B站数据 AI 分析</strong>
    <span>查询 · 推荐 · 可视化</span>
  </div>

  <!-- 新建会话 -->
  <button class="new-session-btn" onclick="newSession()">
    <i class="fa fa-plus"></i> 新建会话
  </button>

  <!-- 历史会话 -->
  <div class="session-section">
    <div class="section-label">历史会话</div>
    <div class="session-list" id="sessionList">
      <div class="no-sessions">暂无历史</div>
    </div>
  </div>

  <nav class="side-menu">
    <a href="#" class="active"><i class="fa fa-comments"></i>AI 问答</a>
    <div class="side-divider"></div>
    <div class="side-section-label">Agent 类型</div>
    <div style="padding:0 6px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
        <span class="agent-pill sql">SQL</span>
        <span style="font-size:12px;color:rgba(255,255,255,.4);">数据统计查询</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:7px;">
        <span class="agent-pill rag">RAG</span>
        <span style="font-size:12px;color:rgba(255,255,255,.4);">语义视频推荐</span>
      </div>
      <div style="display:flex;align-items:center;gap:8px;">
        <span class="agent-pill chat">Chat</span>
        <span style="font-size:12px;color:rgba(255,255,255,.4);">通用对话</span>
      </div>
    </div>
  </nav>

  <!-- 统计 -->
  <div class="stats-panel" id="statsPanel">
    <div class="side-section-label" style="margin-bottom:7px;">查询统计</div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-val" id="statTotal">0</div>
        <div class="stat-label">总查询</div>
      </div>
      <div class="stat-card">
        <div class="stat-val" id="statAvgMs">0ms</div>
        <div class="stat-label">平均耗时</div>
      </div>
      <div class="stat-card" style="grid-column:span 2;">
        <div class="stat-val" id="statFbRate" style="font-size:14px;">-</div>
        <div class="stat-label">好评率</div>
      </div>
    </div>
    <div class="agent-pills" id="agentPills"></div>
  </div>

  <div class="side-bottom">
    <div class="section-label" style="margin-bottom:7px;">系统状态</div>
    <div class="status-row"><span class="dot green"></span>服务运行中</div>
    <div class="status-row"><span class="dot green"></span>向量库就绪</div>
    <div class="status-row"><span class="dot green"></span>缓存在线</div>
  </div>
</div>

<!-- ── 主区域 ─────────────────────────────── -->
<div class="content-wrap">
  <header class="top-hd">
    <span class="hd-title">B站数据 AI 分析助手</span>
    <span class="hd-sub">LLM 语义路由 · 混合检索 · 流式输出</span>
    <span class="hd-ver">v4.0</span>
    <span class="hd-badge"><i class="fa fa-circle" style="font-size:8px;"></i>在线</span>
  </header>

  <div class="page-wrap">
    <div class="suggestions">
      <button onclick="ask('播放量最高的10个视频是哪些？')"><i class="fa fa-fire"></i> 播放量 Top10</button>
      <button onclick="ask('各分区平均播放量是多少？')"><i class="fa fa-bar-chart"></i> 各分区对比</button>
      <button onclick="ask('互动最好的前5个视频')"><i class="fa fa-heart"></i> 互动排行</button>
      <button onclick="ask('发布视频最多的UP主前5名')"><i class="fa fa-user"></i> UP主排行</button>
      <button onclick="ask('推荐一些搞笑有趣的视频')"><i class="fa fa-star"></i> 视频推荐</button>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">
        <div class="label">AI 助手</div>
        <div class="bubble">
          <div style="font-size:15px;font-weight:600;margin-bottom:12px;color:#1e1b4b;">你好！我是B站数据AI分析助手 👋</div>
          <div style="display:flex;flex-direction:column;gap:9px;margin-bottom:14px;">
            <div style="display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:#fff;border-radius:9px;border:1px solid #e0e7ff;">
              <span style="font-size:16px;flex-shrink:0;">📊</span>
              <div>
                <div style="font-weight:600;font-size:13px;color:#1e1b4b;margin-bottom:1px;">查数据</div>
                <div style="font-size:12px;color:#6b7280;">播放量、点赞、UP主排行、分区对比等统计分析</div>
              </div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:#fff;border-radius:9px;border:1px solid #e0e7ff;">
              <span style="font-size:16px;flex-shrink:0;">🔍</span>
              <div>
                <div style="font-weight:600;font-size:13px;color:#1e1b4b;margin-bottom:1px;">找视频</div>
                <div style="font-size:12px;color:#6b7280;">根据关键词语义搜索推荐相关视频</div>
              </div>
            </div>
            <div style="display:flex;align-items:flex-start;gap:9px;padding:9px 11px;background:#fff;border-radius:9px;border:1px solid #e0e7ff;">
              <span style="font-size:16px;flex-shrink:0;">💬</span>
              <div>
                <div style="font-weight:600;font-size:13px;color:#1e1b4b;margin-bottom:1px;">聊天</div>
                <div style="font-size:12px;color:#6b7280;">任何问题都可以问我</div>
              </div>
            </div>
          </div>
          <div style="font-size:12px;color:#9ca3af;">试试上方快捷按钮，或直接输入问题。</div>
        </div>
      </div>
    </div>

    <div class="input-row">
      <input id="inputQ" type="text" placeholder="输入问题，如：哪个UP主粉丝数最多？"
             onkeydown="if(event.key==='Enter')sendQ()"/>
      <button id="sendBtn" onclick="sendQ()">
        <i class="fa fa-paper-plane"></i> 发送
      </button>
    </div>
  </div>
</div>

<script>
var chartInstances = {};
var chatHistory    = [];
var currentSession = '';
var ACCESS_TOKEN   = '{{ access_token }}';

// ── 会话管理 ────────────────────────────────
function newSession() {
  currentSession = '';
  chatHistory    = [];
  var box = document.getElementById('chatBox');
  box.innerHTML = '';
  appendMsg('bot',
    '<div class="bubble"><div style="font-size:13px;color:#6b7280;">新会话已开始，请输入问题。</div></div>');
  loadSessions();
}

function loadSessions() {
  fetch('/api/sessions', {
    headers: {'Authorization': 'Bearer ' + ACCESS_TOKEN}
  }).then(function(r){ return r.json(); }).then(function(sessions) {
    var list = document.getElementById('sessionList');
    if (!sessions || sessions.length === 0) {
      list.innerHTML = '<div class="no-sessions">暂无历史</div>';
      return;
    }
    list.innerHTML = sessions.map(function(s) {
      var active = s.id === currentSession ? ' active' : '';
      var preview = escHtml(s.preview || '（无内容）');
      return '<div class="session-item' + active + '" onclick="loadSession(\'' + s.id + '\')" data-id="' + s.id + '">' +
             '<i class="fa fa-comment-o" style="font-size:12px;color:rgba(255,255,255,.3);flex-shrink:0;"></i>' +
             '<span class="preview">' + preview + '</span>' +
             '<span class="session-del fa fa-times" onclick="delSession(event,\'' + s.id + '\')"></span>' +
             '</div>';
    }).join('');
  }).catch(function(){});
}

function loadSession(sessionId) {
  currentSession = sessionId;
  chatHistory    = [];
  document.querySelectorAll('.session-item').forEach(function(el) {
    el.classList.toggle('active', el.dataset.id === sessionId);
  });
  var box = document.getElementById('chatBox');
  box.innerHTML = '<div style="text-align:center;padding:20px;color:#aaa;font-size:13px;">加载中...</div>';

  fetch('/api/session/' + sessionId + '/history', {
    headers: {'Authorization': 'Bearer ' + ACCESS_TOKEN}
  }).then(function(r){ return r.json(); }).then(function(history) {
    box.innerHTML = '';
    if (!history || history.length === 0) {
      appendMsg('bot', '<div class="bubble"><div style="font-size:13px;color:#6b7280;">暂无历史消息。</div></div>');
      return;
    }
    // 渲染历史消息
    for (var i = 0; i < history.length; i++) {
      var msg = history[i];
      chatHistory.push(msg);
      if (msg.role === 'user') {
        appendMsg('user', '<div class="bubble">' + escHtml(msg.content) + '</div>');
      } else {
        appendMsg('bot', '<div class="bubble"><div style="font-size:14px;line-height:1.8;">' + escHtml(msg.content) + '</div></div>');
      }
    }
    box.scrollTop = box.scrollHeight;
  }).catch(function() {
    box.innerHTML = '';
    appendMsg('bot', '<div class="bubble"><div style="font-size:13px;color:#6b7280;">加载失败，请重试。</div></div>');
  });
}

function delSession(e, sessionId) {
  e.stopPropagation();
  fetch('/api/session/' + sessionId, {
    method: 'DELETE',
    headers: {'Authorization': 'Bearer ' + ACCESS_TOKEN}
  }).then(function() {
    if (currentSession === sessionId) newSession();
    else loadSessions();
  });
}

// ── 统计 ────────────────────────────────────
function loadStats() {
  fetch('/api/stats', {
    headers: {'Authorization': 'Bearer ' + ACCESS_TOKEN}
  }).then(function(r){ return r.json(); }).then(function(s) {
    document.getElementById('statTotal').textContent = s.total || 0;
    document.getElementById('statAvgMs').textContent = (s.avg_ms || 0) + 'ms';
    var fb = s.feedback || {};
    var fbEl = document.getElementById('statFbRate');
    if (fbEl) fbEl.textContent = fb.total ? fb.like_rate + '%' : '-';
    var pills = '';
    if (s.by_agent) {
      if (s.by_agent.sql)  pills += '<span class="agent-pill sql">SQL ' + s.by_agent.sql + '</span>';
      if (s.by_agent.rag)  pills += '<span class="agent-pill rag">RAG ' + s.by_agent.rag + '</span>';
      if (s.by_agent.chat) pills += '<span class="agent-pill chat">Chat ' + s.by_agent.chat + '</span>';
    }
    document.getElementById('agentPills').innerHTML = pills;
  }).catch(function(){});
}

// ── 对话 ────────────────────────────────────
function ask(q) {
  document.getElementById('inputQ').value = q;
  sendQ();
}

function sendQ() {
  var input = document.getElementById('inputQ');
  var q = input.value.trim();
  if (!q) return;
  input.value = '';

  var btn = document.getElementById('sendBtn');
  btn.disabled = true;

  appendMsg('user', '<div class="bubble">' + escHtml(q) + '</div>');

  var thinkId      = 'think_' + Date.now();
  var bubbleId     = 'bubble_' + Date.now();
  var bubbleCreated = false;
  var agentType    = '';
  var answerText   = '';

  appendMsg('bot', '<div class="bubble thinking" id="' + thinkId + '">AI 正在思考</div>');

  function agentIcon(t)  {
    return t==='sql'?'fa-database':t==='rag'?'fa-search':t==='combined'?'fa-random':'fa-comments';
  }
  function agentLabel(t) {
    return t==='sql'?'数据查询':t==='rag'?'视频推荐':t==='combined'?'联合检索':'智能问答';
  }

  function ensureBubble() {
    if (bubbleCreated) return;
    var el = document.getElementById(thinkId);
    if (el) el.parentElement.remove();
    var badge = agentType
      ? '<span class="agent-badge agent-' + agentType + '"><i class="fa ' + agentIcon(agentType) + '"></i> ' + agentLabel(agentType) + '</span>'
      : '';
    appendMsg('bot', badge + '<div class="bubble" id="' + bubbleId + '"><div class="answer-text"></div></div>');
    bubbleCreated = true;
  }

  var sessionId = currentSession || (currentSession = generateId());

  fetch('/api/ask', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + ACCESS_TOKEN
    },
    body: JSON.stringify({ question: q, session_id: sessionId, history: chatHistory })
  }).then(function(resp) {
    var reader  = resp.body.getReader();
    var decoder = new TextDecoder();
    var buf     = '';

    function read() {
      reader.read().then(function(result) {
        if (result.done) {
          btn.disabled = false;
          loadSessions();
          loadStats();
          return;
        }
        buf += decoder.decode(result.value, { stream: true });
        var parts = buf.split('\n\n');
        buf = parts.pop();
        parts.forEach(function(part) {
          if (!part.startsWith('data: ')) return;
          try {
            var chunk = JSON.parse(part.slice(6));
            if (chunk.type === 'agent') {
              agentType = chunk.agent;
            } else if (chunk.type === 'text') {
              ensureBubble();
              answerText += chunk.text;
              var b = document.getElementById(bubbleId);
              if (b) {
                b.querySelector('.answer-text').innerHTML =
                  '<div style="font-size:14px;line-height:1.8;">' + escHtml(answerText) + '</div>';
                document.getElementById('chatBox').scrollTop = 9999;
              }
            } else if (chunk.type === 'rewrite') {
              var hint = document.createElement('div');
              hint.className = 'msg bot';
              hint.innerHTML = '<div class="rewrite-hint"><i class="fa fa-magic"></i>问题已改写为：「' + escHtml(chunk.rewritten) + '」</div>';
              document.getElementById('chatBox').appendChild(hint);
            } else if (chunk.type === 'status') {
              var el = document.getElementById(thinkId);
              if (el) el.textContent = chunk.text;
            } else if (chunk.type === 'done') {
              ensureBubble();
              renderFinal(bubbleId, answerText, chunk);
              chatHistory.push({ role: 'user',      content: q });
              chatHistory.push({ role: 'assistant', content: answerText });
              btn.disabled = false;
              loadSessions();
              loadStats();
            } else if (chunk.type === 'error') {
              var el = document.getElementById(thinkId);
              if (el) el.parentElement.remove();
              appendMsg('bot', '<div class="bubble" style="color:#ef4444;"><i class="fa fa-exclamation-circle"></i> ' + escHtml(chunk.error) + '</div>');
              btn.disabled = false;
              loadStats();
            }
          } catch(e) {}
        });
        read();
      });
    }
    read();
  }).catch(function() {
    var el = document.getElementById(thinkId);
    if (el) el.parentElement.remove();
    appendMsg('bot', '<div class="bubble" style="color:#ef4444;"><i class="fa fa-exclamation-circle"></i> 请求失败，请重试</div>');
    btn.disabled = false;
  });
}

function renderFinal(bubbleId, answerText, data) {
  var chartId = 'chart_' + Date.now();
  var b = document.getElementById(bubbleId);
  if (!b) return;
  var html = '<div style="font-size:14px;line-height:1.8;">' + escHtml(answerText) + '</div>';
  if (data.sql)
    html += '<div class="sql-block">' + escHtml(data.sql) + '</div>';
  if (data.chart && data.chart.should_chart)
    html += '<div class="chart-area" id="' + chartId + '"></div>';
  if (data.rows && data.rows.length > 0) {
    html += '<div class="table-wrap"><table><thead><tr>';
    data.columns.forEach(function(c) { html += '<th>' + escHtml(String(c)) + '</th>'; });
    html += '</tr></thead><tbody>';
    data.rows.forEach(function(row) {
      html += '<tr>';
      row.forEach(function(cell) { html += '<td>' + escHtml(cell===null?'-':String(cell)) + '</td>'; });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
    if (data.total > data.rows.length)
      html += '<div class="total-hint"><i class="fa fa-info-circle"></i> 共 ' + data.total + ' 条，显示前 ' + data.rows.length + ' 条</div>';
    html += '<button class="btn-csv" onclick="downloadCSV(this)"><i class="fa fa-download"></i> 下载 CSV</button>';
  }
  if (data.insight) {
    html += '<div class="insight-box">' + escHtml(data.insight) + '</div>';
  }
  var fbQ = answerText.slice(0,80).replace(/'/g, '');
  html += '<div class="feedback-row">' +
    '<span class="fb-label">有帮助吗？</span>' +
    '<button class="fb-btn" onclick="sendFeedback(this,\'up\',\'' + fbQ + '\')">👍</button>' +
    '<button class="fb-btn" onclick="sendFeedback(this,\'down\',\'' + fbQ + '\')">👎</button>' +
    '</div>';
  b.innerHTML = html;
  document.getElementById('chatBox').scrollTop = 9999;
  if (data.chart && data.chart.should_chart && data.chart.option) {
    setTimeout(function() {
      var el = document.getElementById(chartId);
      if (el) {
        var c = echarts.init(el);
        c.setOption(data.chart.option);
        chartInstances[chartId] = c;
      }
    }, 50);
  }
}

function downloadCSV(btn) {
  var table = btn.closest('.bubble').querySelector('table');
  if (!table) return;
  var csv = Array.from(table.querySelectorAll('tr')).map(function(row) {
    return Array.from(row.querySelectorAll('th,td')).map(function(cell) {
      return '"' + cell.textContent.replace(/"/g,'""') + '"';
    }).join(',');
  }).join('\n');
  var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
  var url  = URL.createObjectURL(blob);
  var a    = document.createElement('a');
  a.href = url; a.download = 'bili_data.csv'; a.click();
  URL.revokeObjectURL(url);
}

function appendMsg(role, content) {
  var box = document.getElementById('chatBox');
  var div = document.createElement('div');
  div.className = 'msg ' + role;
  div.innerHTML = '<div class="label">' + (role==='user'?'你':'AI 助手') + '</div>' + content;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function sendFeedback(btn, rating, question) {
  var row = btn.parentElement;
  row.querySelectorAll('.fb-btn').forEach(function(b) { b.disabled = true; });
  btn.textContent = rating === 'up' ? '👍 谢谢' : '👎 已记录';
  fetch('/api/feedback', {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'Authorization': 'Bearer ' + ACCESS_TOKEN},
    body: JSON.stringify({session_id: currentSession, question: question, rating: rating})
  }).then(function(){ loadStats(); });
}

function generateId() {
  return 'sess_' + Math.random().toString(36).slice(2, 10);
}

window.addEventListener('resize', function() {
  Object.values(chartInstances).forEach(function(c) { try { c.resize(); } catch(e) {} });
});

// 初始化
loadSessions();
loadStats();
setInterval(loadStats, 60000);
</script>
</body>
</html>
